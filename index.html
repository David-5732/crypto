<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Криптарій - Лабораторна робота №1</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --panel-bg: #141414;
            --border-color: #2a2a2a;
            --text-main: #f0f0f0;
            --text-muted: #888888;
            --accent-green: #233329;
            --accent-green-text: #8ae0a8;
            --accent-orange: #d68d4a;
            --accent-orange-hover: #e89b53;
            --btn-bg: #1c1c1c;
            --btn-hover: #2c2c2c;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        header {
            margin-bottom: 30px;
        }

        .lab-subtitle {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .main-title {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 0 0 10px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .main-title span {
            color: var(--text-main);
        }

        .desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            max-width: 600px;
        }

        .app-layout {
            display: flex;
            gap: 20px;
            align-items: stretch;
        }

        /* Sidebar Controls */
        .sidebar {
            width: 280px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .tabs {
            display: flex;
            background-color: var(--btn-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .tab.active {
            background-color: var(--accent-green);
            color: var(--accent-green-text);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        select, input[type="text"], input[type="number"] {
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            font-family: inherit;
            outline: none;
        }

        select:focus, input:focus {
            border-color: var(--accent-green-text);
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        button:hover {
            background-color: var(--btn-hover);
        }

        button.primary {
            background-color: var(--accent-orange);
            color: #000;
            border: none;
            font-weight: 600;
        }

        button.primary:hover {
            background-color: var(--accent-orange-hover);
        }
        
        .file-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .file-status {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 5px;
        }

        /* Main Workspace */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .text-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .panel-header h3 {
            margin: 0;
            font-size: 1rem;
            font-weight: 600;
        }

        .char-count {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        textarea {
            background-color: transparent;
            border: none;
            color: var(--text-main);
            font-family: inherit;
            resize: vertical;
            min-height: 120px;
            outline: none;
            line-height: 1.5;
        }

        textarea::placeholder {
            color: #444;
        }

        /* Histograms */
        .histograms-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        .histograms-panel h3 {
            margin: 0 0 20px 0;
            font-size: 1rem;
        }

        .histogram-container {
            margin-bottom: 20px;
        }

        .histogram-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .chart {
            display: flex;
            align-items: flex-end;
            height: 120px;
            gap: 2px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .bar-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
        }

        .bar {
            width: 100%;
            background-color: var(--accent-green-text);
            border-radius: 2px 2px 0 0;
            min-height: 1px;
            transition: height 0.3s;
            opacity: 0.8;
        }

        .bar:hover {
            opacity: 1;
        }

        .bar-label {
            font-size: 0.6rem;
            color: var(--text-muted);
            margin-top: 5px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="lab-subtitle">Лабораторна робота №1 КРИПТОГРАФІЯ</div>
        <h1 class="main-title">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path></svg>
            <span>Криптарій</span>
        </h1>
        <div class="desc">Шифр Цезаря та таблична перестановка: шифрування, розшифрування й гістограми частот.</div>
    </header>

    <div class="app-layout">
        <aside class="sidebar">
            <div class="tabs">
                <div class="tab active" id="tab-caesar" onclick="setCipher('caesar')">Цезар</div>
                <div class="tab" id="tab-perm" onclick="setCipher('perm')">Перестановка</div>
            </div>

            <div class="input-group">
                <label>Абетка</label>
                <select id="alphabet-select" onchange="updateHistograms()">
                    <option value="uk">Українська</option>
                    <option value="en">English</option>
                </select>
            </div>

            <div class="input-group">
                <label id="key-label">Зміщення k</label>
                <input type="text" id="cipher-key" value="7">
            </div>

            <div class="action-grid">
                <button class="primary" onclick="processText('encrypt')">Зашифрувати</button>
                <button onclick="processText('decrypt')">Розшифрувати</button>
                <button onclick="loadSample()">Зразок</button>
                <button onclick="clearAll()">Очистити</button>
            </div>

            <div class="file-actions">
                <button onclick="document.getElementById('file-input').click()">Відкрити .txt</button>
                <input type="file" id="file-input" style="display: none" accept=".txt" onchange="openFile(event)">
                <button onclick="saveFile('input')">Зберегти вихідний</button>
                <button onclick="saveFile('output')">Зберегти шифртекст</button>
                <div class="file-status" id="file-status">Файл ще не відкрито</div>
            </div>
        </aside>

        <main class="workspace">
            <div class="text-panel">
                <div class="panel-header">
                    <h3>Вихідний текст</h3>
                    <span class="char-count" id="in-count">0 символів</span>
                </div>
                <textarea id="input-text" placeholder="Вставте відкритий текст або відкрийте файл..." oninput="onInputTextChange()"></textarea>
            </div>

            <div class="text-panel">
                <div class="panel-header">
                    <h3>Шифртекст</h3>
                    <span class="char-count" id="out-count">0 символів</span>
                </div>
                <textarea id="output-text" placeholder="Тут з'явиться результат..."></textarea>
            </div>

            <div class="histograms-panel">
                <h3>Гістограми частот</h3>
                
                <div class="histogram-container">
                    <div class="histogram-title">Вихідний текст</div>
                    <div class="chart" id="chart-input"></div>
                </div>

                <div class="histogram-container">
                    <div class="histogram-title">Шифртекст</div>
                    <div class="chart" id="chart-output"></div>
                </div>
            </div>
        </main>
    </div>
</div>

<script>
    // Alphabets
    const alphabets = {
        uk: 'абвгґдеєжзиіїйклмнопрстуфхцчшщьюя',
        en: 'abcdefghijklmnopqrstuvwxyz'
    };

    let currentCipher = 'caesar'; // 'caesar' or 'perm'

    function setCipher(type) {
        currentCipher = type;
        document.getElementById('tab-caesar').classList.toggle('active', type === 'caesar');
        document.getElementById('tab-perm').classList.toggle('active', type === 'perm');
        
        const keyLabel = document.getElementById('key-label');
        const keyInput = document.getElementById('cipher-key');
        
        if (type === 'caesar') {
            keyLabel.innerText = 'Зміщення k';
            keyInput.type = 'number';
            keyInput.value = '7';
        } else {
            keyLabel.innerText = 'Ключ (слово)';
            keyInput.type = 'text';
            keyInput.value = 'СЕКРЕТ';
        }
    }

    function onInputTextChange() {
        document.getElementById('in-count').innerText = `${document.getElementById('input-text').value.length} символів`;
        updateHistograms();
    }

    function updateOutCount() {
        document.getElementById('out-count').innerText = `${document.getElementById('output-text').value.length} символів`;
    }

    function clearAll() {
        document.getElementById('input-text').value = '';
        document.getElementById('output-text').value = '';
        document.getElementById('file-status').innerText = 'Файл ще не відкрито';
        document.getElementById('file-input').value = '';
        onInputTextChange();
        updateOutCount();
        updateHistograms();
    }

    function loadSample() {
        document.getElementById('input-text').value = "Криптографія — це наука про математичні методи забезпечення конфіденційності, цілісності і автентичності інформації.";
        onInputTextChange();
    }

    // Processing Logic
    function processText(action) {
        const text = document.getElementById('input-text').value;
        const keyVal = document.getElementById('cipher-key').value;
        const lang = document.getElementById('alphabet-select').value;
        let result = '';

        if (!text) return;

        if (currentCipher === 'caesar') {
            const shift = parseInt(keyVal) || 0;
            result = caesarCipher(text, action === 'encrypt' ? shift : -shift, alphabets[lang]);
        } else {
            result = columnarTransposition(text, keyVal.toUpperCase(), action === 'encrypt');
        }

        document.getElementById('output-text').value = result;
        updateOutCount();
        updateHistograms();
    }

    // Caesar Cipher
    function caesarCipher(text, shift, alphabet) {
        let result = '';
        const len = alphabet.length;
        
        // Handle negative shifts correctly in JS
        shift = ((shift % len) + len) % len;

        for (let i = 0; i < text.length; i++) {
            let char = text[i];
            let isUpper = char === char.toUpperCase();
            let lowerChar = char.toLowerCase();
            let idx = alphabet.indexOf(lowerChar);

            if (idx !== -1) {
                let newIdx = (idx + shift) % len;
                let newChar = alphabet[newIdx];
                result += isUpper ? newChar.toUpperCase() : newChar;
            } else {
                result += char; // Keep symbols and spaces
            }
        }
        return result;
    }

    // Columnar Transposition Cipher (Таблична перестановка)
    function columnarTransposition(text, key, isEncrypt) {
        if (!key) return text;
        
        // Remove spaces for standard classical transposition (optional, but typical for labs)
        let processedText = isEncrypt ? text.replace(/\s+/g, '') : text;
        
        let colCount = key.length;
        let rowCount = Math.ceil(processedText.length / colCount);
        
        // Determine column reading order based on alphabetical order of key characters
        let keyArr = Array.from(key).map((char, index) => ({ char, index }));
        keyArr.sort((a, b) => a.char.localeCompare(b.char));
        
        let result = '';

        if (isEncrypt) {
            let grid = [];
            let k = 0;
            for (let r = 0; r < rowCount; r++) {
                grid[r] = [];
                for (let c = 0; c < colCount; c++) {
                    grid[r][c] = k < processedText.length ? processedText[k++] : ''; 
                }
            }
            for (let item of keyArr) {
                let c = item.index;
                for (let r = 0; r < rowCount; r++) {
                    if (grid[r][c]) result += grid[r][c];
                }
            }
        } else {
            // Decrypt
            let emptyCells = (colCount * rowCount) - processedText.length;
            let colLengths = Array(colCount).fill(rowCount);
            // Subtract lengths from the end columns if grid is not full
            for(let i = 0; i < emptyCells; i++) {
                colLengths[colCount - 1 - i]--;
            }
            
            let grid = Array.from({ length: rowCount }, () => Array(colCount).fill(''));
            let k = 0;
            
            // Fill columns in sorted key order
            for (let item of keyArr) {
                let c = item.index;
                for (let r = 0; r < colLengths[c]; r++) {
                    grid[r][c] = processedText[k++];
                }
            }
            
            // Read rows
            for (let r = 0; r < rowCount; r++) {
                for (let c = 0; c < colCount; c++) {
                    if (grid[r][c]) result += grid[r][c];
                }
            }
        }
        return result;
    }

    // Histograms
    function updateHistograms() {
        const inText = document.getElementById('input-text').value;
        const outText = document.getElementById('output-text').value;
        const lang = document.getElementById('alphabet-select').value;
        const alphabet = alphabets[lang];

        drawChart(inText, alphabet, 'chart-input');
        drawChart(outText, alphabet, 'chart-output');
    }

    function drawChart(text, alphabet, containerId) {
        const container = document.getElementById(containerId);
        container.innerHTML = '';
        
        if (!text) return;

        let counts = {};
        let maxCount = 0;
        
        for (let char of text.toLowerCase()) {
            if (alphabet.includes(char)) {
                counts[char] = (counts[char] || 0) + 1;
                if (counts[char] > maxCount) maxCount = counts[char];
            }
        }

        for (let char of alphabet) {
            let count = counts[char] || 0;
            let heightPercent = maxCount === 0 ? 0 : (count / maxCount) * 100;
            
            let barGroup = document.createElement('div');
            barGroup.className = 'bar-group';
            barGroup.title = `${char.toUpperCase()}: ${count}`;
            
            barGroup.innerHTML = `
                <div class="bar" style="height: ${heightPercent}%"></div>
                <div class="bar-label">${char}</div>
            `;
            container.appendChild(barGroup);
        }
    }

    // File Operations
    function openFile(event) {
        const file = event.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('input-text').value = e.target.result;
            document.getElementById('file-status').innerText = `Відкрито: ${file.name}`;
            onInputTextChange();
        };
        reader.readAsText(file);
    }

    function saveFile(type) {
        const textId = type === 'input' ? 'input-text' : 'output-text';
        const text = document.getElementById(textId).value;
        if (!text) {
            alert('Немає тексту для збереження!');
            return;
        }

        const blob = new Blob([text], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = type === 'input' ? 'source.txt' : 'cipher.txt';
        a.click();
        URL.revokeObjectURL(a.href);
    }

    // Initialize
    updateHistograms();
</script>

</body>
</html>
